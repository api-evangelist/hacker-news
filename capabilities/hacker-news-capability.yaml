naftiko: 1.0.0-alpha2
info:
  label: Hacker News API
  description: The official Hacker News API provides read-only access to items (stories, comments, jobs, Ask HNs, polls),
    users, and live data via Firebase. No authentication is required.
  tags:
  - Hacker
  - News
  - API
  created: '2026-05-06'
  modified: '2026-05-06'
capability:
  consumes:
  - type: http
    namespace: hacker-news
    baseUri: https://hacker-news.firebaseio.com/v0
    description: Hacker News API HTTP API.
    resources:
    - name: item-id-json
      path: /item/{id}.json
      operations:
      - name: getitem
        method: GET
        description: Get item by ID
        inputParameters:
        - name: id
          in: path
          type: integer
          required: true
          description: Numeric item ID.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: user-username-json
      path: /user/{username}.json
      operations:
      - name: getuser
        method: GET
        description: Get user profile
        inputParameters:
        - name: username
          in: path
          type: string
          required: true
          description: Case-sensitive HN username.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: maxitem-json
      path: /maxitem.json
      operations:
      - name: getmaxitem
        method: GET
        description: Get max item ID
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: topstories-json
      path: /topstories.json
      operations:
      - name: gettopstories
        method: GET
        description: Get top stories
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: newstories-json
      path: /newstories.json
      operations:
      - name: getnewstories
        method: GET
        description: Get new stories
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: beststories-json
      path: /beststories.json
      operations:
      - name: getbeststories
        method: GET
        description: Get best stories
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: askstories-json
      path: /askstories.json
      operations:
      - name: getaskstories
        method: GET
        description: Get latest Ask HN stories
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: showstories-json
      path: /showstories.json
      operations:
      - name: getshowstories
        method: GET
        description: Get latest Show HN stories
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: jobstories-json
      path: /jobstories.json
      operations:
      - name: getjobstories
        method: GET
        description: Get latest job stories
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: updates-json
      path: /updates.json
      operations:
      - name: getupdates
        method: GET
        description: Get changed items and profiles
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8080
    namespace: hacker-news-rest
    description: REST adapter for Hacker News API.
    resources:
    - path: /item/{id}.json
      name: getitem
      operations:
      - method: GET
        name: getitem
        description: Get item by ID
        call: hacker-news.getitem
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
    - path: /user/{username}.json
      name: getuser
      operations:
      - method: GET
        name: getuser
        description: Get user profile
        call: hacker-news.getuser
