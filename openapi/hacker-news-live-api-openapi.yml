openapi: 3.0.3
info:
  title: Hacker News Items Live API
  description: The official Hacker News API provides read-only access to items (stories, comments, jobs, Ask HNs, polls), users, and live data via Firebase. No authentication is required.
  version: v0
  contact:
    name: Hacker News
    url: https://github.com/HackerNews/API
  license:
    name: MIT
    url: https://github.com/HackerNews/API/blob/master/LICENSE
servers:
- url: https://hacker-news.firebaseio.com/v0
  description: Production Firebase endpoint
tags:
- name: Live
  description: Max item ID and recent updates.
paths:
  /maxitem.json:
    get:
      summary: Get max item ID
      description: Returns the current largest item ID.
      operationId: getMaxItem
      tags:
      - Live
      responses:
        '200':
          description: Latest item ID
          content:
            application/json:
              schema:
                type: integer
  /updates.json:
    get:
      summary: Get changed items and profiles
      description: Returns items and user profiles that have recently changed.
      operationId: getUpdates
      tags:
      - Live
      responses:
        '200':
          description: Updates payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: integer
                  profiles:
                    type: array
                    items:
                      type: string
