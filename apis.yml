apis:
  - aid: hacker-news:hacker-news-api
    name: Hacker News API
    tags:
      - Comments
      - News
      - Stories
    image: https://kinlane-productions2.s3.amazonaws.com/apis-json/apis-json-logo.jpg
    baseURL: https://hacker-news.firebaseio.com
    humanURL: https://github.com/HackerNews/API
    properties:
      - url: https://github.com/HackerNews/API
        type: Documentation
    description: >-
      The Hacker News API provides access to items (stories, comments, jobs, Ask HNs,
      polls), users, and live data via Firebase endpoints. It is a public, read-only
      REST API that exposes the full dataset of Hacker News content in near real-time.
      Developers can retrieve individual items by ID, look up user profiles, and subscribe
      to live feeds of new, top, best, ask, show, and job stories. The API requires
      no authentication and returns JSON data from Firebase's real-time database infrastructure.
